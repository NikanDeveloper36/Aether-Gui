name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Version of the Aether core engine fetched from upstream.
  ENGINE_VERSION: "v1.8.0"

jobs:
  # ── Windows: Inno Setup installer + portable ZIP ───────────────────
  windows:
    runs-on: windows-latest
    name: Windows x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install customtkinter pyinstaller pillow

      - name: Fetch the core engine
        shell: pwsh
        run: |
          $base = "https://github.com/CluvexStudio/Aether/releases/download/${{ env.ENGINE_VERSION }}"
          curl.exe -sSL -o engine.zip "$base/aether-windows-x86_64.zip"
          Expand-Archive engine.zip -DestinationPath engine
          $bin = Get-ChildItem engine -Recurse -Filter aether.exe | Select-Object -First 1
          Copy-Item $bin.FullName aether.exe
          .\aether.exe --version 2>&1 | Select-Object -First 1

      - name: Build the GUI
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name AetherGUI `
            --icon assets/icon.ico `
            --collect-all customtkinter `
            src/aether_gui.py
          Get-Item dist/AetherGUI.exe | Select-Object Name, Length

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" "/DAppDir=$PWD" "installer\windows\AetherGUI.iss"
          Get-ChildItem installer/output

      - name: Build the portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $pkg = "AetherGUI-$ver-Windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item dist/AetherGUI.exe $pkg/
          Copy-Item aether.exe $pkg/
          Copy-Item README.md, LICENSE $pkg/
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/output/*.exe
            AetherGUI-*-Windows-x64-portable.zip
          if-no-files-found: error

  # ── Linux: .deb + .rpm + .AppImage ─────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    name: Linux x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm libx11-6 libxext6 libxrender1 libxft2
          pip install customtkinter pyinstaller pillow

      - name: Fetch the core engine
        run: |
          base="https://github.com/CluvexStudio/Aether/releases/download/${{ env.ENGINE_VERSION }}"
          curl -sSL -o engine.tar.gz "$base/aether-linux-x86_64.tar.gz"
          tar xzf engine.tar.gz
          find . -maxdepth 2 -name aether -type f -exec cp {} ./aether \;
          chmod +x aether
          ./aether --version 2>&1 | head -1 || true

      - name: Fetch appimagetool
        run: |
          sudo curl -sSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version 2>&1 | head -2 || true

      - name: Build the GUI
        run: |
          pyinstaller --onefile --name AetherGUI \
            --collect-all customtkinter \
            src/aether_gui.py
          ls -lh dist/

      - name: Package .deb / .rpm / .AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x installer/linux/package.sh
          ./installer/linux/package.sh "${GITHUB_REF_NAME#v}" amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: installer/output/*
          if-no-files-found: error

  # ── macOS: .dmg for Apple Silicon and Intel ────────────────────────
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon
            arch: arm64
            engine: aether-macos-arm64.tar.gz
          - os: macos-13      # Intel
            arch: x64
            engine: aether-macos-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install customtkinter pyinstaller pillow

      - name: Fetch the core engine
        run: |
          base="https://github.com/CluvexStudio/Aether/releases/download/${{ env.ENGINE_VERSION }}"
          curl -sSL -o engine.tar.gz "$base/${{ matrix.engine }}"
          tar xzf engine.tar.gz
          find . -maxdepth 2 -name aether -type f -exec cp {} ./aether \;
          chmod +x aether
          ./aether --version 2>&1 | head -1 || true

      - name: Build the GUI bundle
        run: |
          pyinstaller --windowed --name AetherGUI \
            --icon assets/icon-1024.png \
            --osx-bundle-identifier io.github.nikandeveloper36.aethergui \
            --collect-all customtkinter \
            src/aether_gui.py
          ls -la dist/

      - name: Package the .dmg
        run: |
          chmod +x installer/macos/package.sh
          ./installer/macos/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: installer/output/*.dmg
          if-no-files-found: error

  # ── Publish everything as one release ──────────────────────────────
  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
          body: |
            ## Aether GUI ${{ github.ref_name }}

            A graphical interface for the Aether networking core.
            **Core engine built by Nikan Developer.**

            ### Installers

            | Platform | File | How |
            |----------|------|-----|
            | **Windows** 10/11 (x64) | `AetherGUI-*-Windows-x64-Setup.exe` | Run the setup |
            | **Windows** portable | `AetherGUI-*-Windows-x64-portable.zip` | Extract and run |
            | **Linux** Debian/Ubuntu | `AetherGUI-*-Linux-amd64.deb` | `sudo apt install ./file.deb` |
            | **Linux** Fedora/RHEL | `AetherGUI-*-Linux-amd64.rpm` | `sudo rpm -i file.rpm` |
            | **Linux** any distro | `AetherGUI-*-Linux-x86_64.AppImage` | `chmod +x` then run |
            | **macOS** Apple Silicon | `AetherGUI-*-macOS-arm64.dmg` | Open, drag to Applications |
            | **macOS** Intel | `AetherGUI-*-macOS-x64.dmg` | Open, drag to Applications |

            Every installer bundles the core engine — nothing else to download.

            ### macOS note

            The app is not signed with an Apple Developer ID, so Gatekeeper warns on
            first launch. Right-click the app → **Open** → **Open**, or run:

            ```
            xattr -dr com.apple.quarantine /Applications/AetherGUI.app
            ```

            ### Verify

            `SHA256SUMS.txt` lists every file.

            ---

            Built by [Nikan Developer](https://github.com/NikanDeveloper36)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
